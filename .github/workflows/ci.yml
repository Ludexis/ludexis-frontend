name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      # Same major version as the image.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # The image's build settings: relative API and media URLs behind the bundled proxy.
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_MEDIA_URL: /media
        run: npm run build

  publish:
    # Images are published only from a pushed commit or tag whose checks pass.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Builds arm64 images too (Raspberry Pi and other ARM home servers).
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main publishes :main and :latest (what the compose file pulls); a v1.2.3 tag publishes :1.2.3 and :1.2 to pin.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ludexis-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # A v1.2.3 tag also gets a GitHub release once its image is published.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "ludexis-frontend $TAG" --notes "Image: \`ghcr.io/ludexis/ludexis-frontend:$version\` (\`linux/amd64\`, \`linux/arm64\`).

          What changed: [Ludexis $TAG release notes](https://github.com/Ludexis/Ludexis/releases/tag/$TAG)."
